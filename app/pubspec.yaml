name: photo_enhancement
description: Local-first photo editor backed by a shared C++ image kernel.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  crypto: ^3.0.6
  file_selector: ^1.0.3
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/presets/
    - assets/luts/
    - assets/frame_marks/
    - assets/frame_fonts/
